<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>구스구스덕</title>
<style>
:root{--bg:#f4f1ea;--fg:#1d1d1f;--card:#fff;--ac:#e8a317;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15171c;--fg:#f2f2f2;--card:#23262e;--ac:#ffc83d}}
:root[data-theme="dark"]{--bg:#15171c;--fg:#f2f2f2;--card:#23262e;--ac:#ffc83d}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
canvas{position:absolute;inset:0;width:100%;height:100%}
.ov{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:color-mix(in srgb,var(--bg) 88%,transparent);padding:16px;text-align:center;overflow:auto}
.card{background:var(--card);border-radius:16px;padding:20px;max-width:340px;width:100%;box-shadow:0 4px 24px #0004;display:flex;flex-direction:column;gap:10px}
button,input{font:inherit;border-radius:12px;border:0;padding:12px 16px}
button{background:var(--ac);color:#222;font-weight:700;cursor:pointer}button:disabled{opacity:.4}
input{background:var(--bg);color:var(--fg);text-align:center}
.chip{display:inline-block;padding:4px 10px;margin:3px;border-radius:99px;color:#111;font-weight:600;font-size:14px}
#hud{position:absolute;top:calc(8px + env(safe-area-inset-top,0px));left:0;right:0;text-align:center;pointer-events:none;font-weight:700;text-shadow:0 1px 3px #000;color:#fff}
#bar{height:8px;width:60%;margin:6px auto;background:#0006;border-radius:9px;overflow:hidden}#bar i{display:block;height:100%;width:0;background:#6fd36f}
#acts{position:absolute;right:14px;bottom:calc(20px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:10px}
#acts button{width:84px;height:84px;border-radius:50%;display:none}
#bKill{background:#e53935!important;color:#fff!important}
#joy{position:absolute;left:14px;bottom:calc(20px + env(safe-area-inset-bottom,0px));width:140px;height:140px;border-radius:50%;background:#fff3;border:2px solid #fff6}
#knob{position:absolute;left:45px;top:45px;width:50px;height:50px;border-radius:50%;background:#fffa}
#flash{position:absolute;top:30%;left:0;right:0;text-align:center;font-size:30px;font-weight:800;color:#fff;text-shadow:0 2px 8px #000;pointer-events:none}
#nameCard{background:#000 url(title.jpg) center/cover no-repeat;justify-content:flex-end}
#nameCard::before{content:"";position:absolute;inset:0;background:linear-gradient(transparent 35%,#000b)}
#nameCard .card{position:relative;background:transparent;box-shadow:none;color:#fff;margin-bottom:6vh}
#ttl{margin:0;font-size:clamp(44px,13vw,84px);font-weight:900;color:#ffc83d;-webkit-text-stroke:3px #1b1b1b;paint-order:stroke fill;text-shadow:0 6px 0 #1b1b1b,0 10px 24px #000a;letter-spacing:2px}
#nameCard input{background:#fffe;color:#222}
.vb{width:100%;text-align:left}.vb.sel{outline:3px solid #fff}
</style></head><body>
<canvas id="cv"></canvas>
<div id="hud"><div id="role"></div><div id="bar"><i></i></div><div id="msg"></div></div>
<div id="flash"></div>
<div id="joy"><div id="knob"></div></div>
<div id="acts"><button id="bKill">공격</button><button id="bRep">신고</button><button id="bAct">작업</button></div>

<div class="ov" id="nameCard" style="display:flex"><div class="card">
<h1 id="ttl">구스구스덕</h1><div style="font-weight:700;text-shadow:0 2px 6px #000">닉네임을 정하고 입장하세요</div>
<input id="nick" maxlength="8" placeholder="닉네임"><button id="go">입장</button>
<small id="warn"></small></div></div>

<div class="ov" id="lobby"><div class="card"><h3 style="margin:0">대기실</h3><div id="plist"></div>
<div id="wait"></div><button id="start">게임 시작</button>
<small><a href="/qr" target="_blank" style="color:inherit">📱 QR 코드 보기</a></small>
<small>거위는 작업을 모두 끝내고, 오리는 거위를 몰래 처치하세요. 시체를 발견하거나 중앙 테이블에서 신고하면 회의가 열려요. 회의 중 대화는 현장에서 직접!</small></div></div>

<div class="ov" id="meet"><div class="card"><h3 style="margin:0" id="mt"></h3><div id="vl" style="display:flex;flex-direction:column;gap:6px"></div></div></div>
<div class="ov" id="end"><div class="card"><h2 id="et" style="margin:0"></h2><div id="er"></div><button id="again">대기실로</button></div></div>

<script>
(async()=>{
function makeRoom(){
 const q=new URLSearchParams(location.search),rm=((q.get('room')||'main').toLowerCase().replace(/[^a-z0-9_-]/g,'').slice(0,24))||'main';
 const st={peers:[],me:'',ok:false,loc:{},ws:null};
 const send=()=>{if(st.ws&&st.ws.readyState===1)st.ws.send(JSON.stringify({t:'p',d:st.loc}))};
 const open=()=>{const ws=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host+'/ws?room='+rm);st.ws=ws;
  ws.onopen=()=>{st.ok=true;send()};
  ws.onmessage=e=>{let m;try{m=JSON.parse(e.data)}catch(x){return}
   if(m.t==='hello')st.me=m.id;
   else if(m.t==='full'){alert('방이 가득 찼어요 (최대 16명)')}
   else if(m.t==='snap')st.peers=m.p.map(p=>({peer:p.id,kind:'viewer',presence:p.d||{},isMe:p.id===st.me,sameTab:p.id===st.me}))};
  ws.onclose=()=>{st.ok=false;st.peers=[];setTimeout(open,1000)};ws.onerror=()=>{try{ws.close()}catch(x){}}};
 open();
 return{peers:()=>st.peers,ok:()=>st.ok,presence:patch=>{for(const k in patch){if(patch[k]===null)delete st.loc[k];else st.loc[k]=patch[k]}send();return Promise.resolve()}};
}
const $=i=>document.getElementById(i),cv=$('cv'),cx=cv.getContext('2d');
const COL=['#e53935','#1e88e5','#43a047','#fdd835','#8e24aa','#fb8c00','#00acc1','#f06292','#8d6e63','#cfd8dc'];
const ST=[[834,458],[706,573],[1312,331],[837,928],[1131,714],[1294,834],[1202,477],[334,342],[331,787],[192,568],[627,741],[478,512],[1584,536],[1128,954]];
const NEED=5,TX=936,TY=361;
const SPR=new Image();SPR.src='goose.png';
const room=makeRoom();
const M={n:'',c:0,x:936,y:361,done:new Set(),cd:0,ks:0,kt:'',rs:0,v:'',work:0,gid:null,sq:null,mi:null,f:-1};
const SM={};let G={ph:'lobby'},myId='',hostId='',isHost=false,keys={},jv={x:0,y:0},startReq=false,seen={},rsSeen={},lastK={},HG={ph:'lobby',gid:'',sq:0,mi:0,d:[],b:[],rl:{}},lastPub='',wasHost=false,flashT=0,mKey='';
setInterval(()=>{$('warn').textContent=room.ok()?'':'서버에 연결 중… (처음엔 최대 1분 걸릴 수 있어요)'},500);
const el=(t,x,c,f)=>{const e=document.createElement(t);if(x)e.textContent=x;if(c)e.className=c;if(f)e.onclick=f;return e};
const players=()=>room?room.peers().filter(p=>p.kind==='viewer'&&p.presence&&p.presence.n):[];
$('nick').value='플레이어'+(Math.random()*90+10|0);
$('go').onclick=()=>{if(!room)return;M.n=$('nick').value.trim().slice(0,8)||'익명';M.c=Math.random()*10|0;$('nameCard').style.display='none'};
$('start').onclick=()=>{startReq=true};
$('again').onclick=()=>{startReq=true};
addEventListener('keydown',e=>keys[e.key.toLowerCase()]=1);addEventListener('keyup',e=>keys[e.key.toLowerCase()]=0);
// joystick
const joy=$('joy'),kn=$('knob');let jp=null;
const jm=e=>{const r=joy.getBoundingClientRect(),dx=e.clientX-r.left-70,dy=e.clientY-r.top-70,d=Math.hypot(dx,dy)||1,k=Math.min(d,50)/d;jv.x=dx*k/50;jv.y=dy*k/50;kn.style.left=45+dx*k+'px';kn.style.top=45+dy*k+'px'};
joy.onpointerdown=e=>{jp=e.pointerId;joy.setPointerCapture(jp);jm(e)};joy.onpointermove=e=>{if(e.pointerId===jp)jm(e)};
joy.onpointerup=joy.onpointercancel=()=>{jp=null;jv={x:0,y:0};kn.style.left=kn.style.top='45px'};
const MK={},BG=new Image();BG.src='map.jpg';
const MI=new Image();MI.onload=()=>{const c=document.createElement('canvas');c.width=MI.width;c.height=MI.height;const g=c.getContext('2d');g.drawImage(MI,0,0);MK.d=g.getImageData(0,0,c.width,c.height).data;MK.w=c.width;MK.h=c.height};MI.src='mask.png';
const walk=(x,y)=>{if(!MK.d)return true;const px=x>>1,py=y>>1;return px>=0&&py>=0&&px<MK.w&&py<MK.h&&MK.d[(py*MK.w+px)*4]>128};
const hit=(x,y,r)=>!(walk(x,y)&&walk(x-r,y)&&walk(x+r,y)&&walk(x,y-r)&&walk(x,y+r));
const me=()=>G.rl&&G.rl[myId],isDead=()=>(G.d||[]).includes(myId);
const near=(a,b,r)=>Math.hypot(a[0]-b[0],a[1]-b[1])<r;
let stI=-1,tgt=null,atBody=false;
$('bAct').onclick=()=>{if(stI>=0&&!M.work)M.work=Date.now()+2500};
$('bRep').onclick=()=>{M.rs++};
$('bKill').onclick=()=>{if(tgt&&Date.now()>M.cd){M.ks++;M.kt=tgt.peer;M.cd=Date.now()+20000}};

function hostTick(){
 const P=players(),by=Object.fromEntries(P.map(p=>[p.peer,p])),H=HG,now=Date.now();
 const live=p=>!H.d.includes(p.peer),role=p=>H.rl[p.peer];
 if(H.ph==='lobby'||H.ph==='end'){
  if(startReq&&P.length>=3){
   startReq=false;const ids=P.map(p=>p.peer).sort(()=>Math.random()-.5),nd=P.length>=8?2:1;
   H.rl={};ids.forEach((id,i)=>H.rl[id]=i<nd?'d':'g');H.d=[];H.b=[];H.ph='play';H.gid=String(now);H.sq++;H.mi=0;H.w='';
   H.tt=NEED*(P.length-nd);H.td=0;P.forEach(p=>lastK[p.peer]=now+8000);
  }else if(startReq&&H.ph==='end'){startReq=false;H.ph='lobby'}
  startReq=false;
 }else if(H.ph==='play'){
  P.forEach(p=>{const r=p.presence;
   if(r.ks>(seen[p.peer]||0)){seen[p.peer]=r.ks;const t=by[r.kt];
    if(role(p)==='d'&&live(p)&&t&&live(t)&&role(t)==='g'&&Math.hypot(r.x-t.presence.x,r.y-t.presence.y)<100&&now-(lastK[p.peer]||0)>19000){lastK[p.peer]=now;H.d.push(t.peer);H.b.push([t.presence.x,t.presence.y,t.peer])}}
   if(r.rs>(rsSeen[p.peer]||0)){rsSeen[p.peer]=r.rs;
    if(live(p)&&(H.b.some(b=>Math.hypot(b[0]-r.x,b[1]-r.y)<120)||Math.hypot(r.x-TX,r.y-TY)<110)){H.ph='meet';H.ml=40000;H.b=[];H.by=p.presence.n;H.mi++}}
  });
  const gs=P.filter(p=>role(p)==='g'),du=P.filter(p=>role(p)==='d'&&live(p)),gl=gs.filter(live);
  H.td=gs.reduce((s,p)=>s+Math.min(p.presence.t||0,NEED),0);H.tt=NEED*gs.length;
  if(!du.length)H.w='g';else if(du.length>=gl.length)H.w='d';else if(gs.length&&H.td>=H.tt)H.w='g';
  if(H.w)H.ph='end';
 }else if(H.ph==='meet'){
  H.ml-=250;const lv=P.filter(live);
  if(H.ml<=0||lv.every(p=>p.presence.v)){
   const c={};lv.forEach(p=>{const v=p.presence.v||'skip';c[v]=(c[v]||0)+1});
   const s=Object.entries(c).sort((a,b)=>b[1]-a[1]);H.ej=null;
   if(s.length&&s[0][0]!=='skip'&&(!s[1]||s[1][1]<s[0][1])&&by[s[0][0]]){const t=by[s[0][0]];H.d.push(t.peer);H.ej={n:t.presence.n,r:role(t)}}
   H.ph='res';H.ml=4500;
  }
 }else if(H.ph==='res'){H.ml-=250;if(H.ml<=0){H.ph='play';H.sq++}}
 const s=JSON.stringify(H);if(s!==lastPub){lastPub=s;room.presence({g:JSON.parse(s)}).catch(()=>{})}
}
function push(){room.presence({n:M.n,c:M.c,x:M.x|0,y:M.y|0,t:M.done.size,v:M.v,ks:M.ks,kt:M.kt,rs:M.rs,f:M.f})}
function sync(){
 if(!room)return;const P=players(),mp=room.peers().find(p=>p.sameTab);myId=mp?mp.peer:'';
 const sorted=P.map(p=>p.peer).sort();hostId=sorted[0]||'';isHost=hostId===myId&&!!myId;
 const hp=P.find(p=>p.peer===hostId);G=(hp&&hp.presence.g)||{ph:'lobby',d:[],rl:{}};
 if(isHost&&!wasHost){HG={ph:'lobby',gid:'',sq:(G.sq||0)+1,mi:(G.mi||0)+1,d:[],b:[],rl:{}};lastPub='';P.forEach(p=>{seen[p.peer]=p.presence.ks||0;rsSeen[p.peer]=p.presence.rs||0})}
 wasHost=isHost;if(isHost)hostTick();
 if(G.gid!==M.gid){M.gid=G.gid;M.done=new Set();M.work=0;M.v='';if(G.ph==='play'&&me()){flashT=Date.now()+3500;$('flash').textContent=me()==='d'?'당신은 🦆 오리':'당신은 🪿 거위'}}
 if(G.sq!==M.sq){M.sq=G.sq;const a=Math.random()*6.28;M.x=TX+Math.cos(a)*60;M.y=TY+Math.sin(a)*60;M.cd=Date.now()+(G.ph==='play'?10000:0)}
 if(G.mi!==M.mi){M.mi=G.mi;M.v=''}
 if(M.n)push();
}
setInterval(sync,200);setInterval(()=>{if(M.n)push()},90);
function ui(){
 const P=players(),ph=G.ph,r=me(),dead=isDead();
 $('lobby').style.display=M.n&&ph==='lobby'?'flex':'none';
 if(ph==='lobby'){$('plist').replaceChildren(...P.map(p=>{const s=el('span',p.presence.n+(p.peer===hostId?' ★':''),'chip');s.style.background=COL[p.presence.c%10];return s}));
  $('start').style.display=isHost?'block':'none';$('start').disabled=P.length<3;
  $('wait').textContent=isHost?(P.length<3?'3명 이상 모이면 시작할 수 있어요':'준비되면 시작하세요'):'방장(★)이 시작하길 기다리는 중…'}
 $('meet').style.display=ph==='meet'?'flex':'none';
 if(ph==='meet'){$('mt').textContent=(G.by||'')+'님이 신고! 남은 시간 '+Math.max(0,Math.ceil((G.ml||0)/1000))+'초';
  const live=P.filter(p=>!(G.d||[]).includes(p.peer)),k=G.mi+'|'+M.v+'|'+dead+'|'+live.map(p=>p.peer).join();
  if(k!==mKey){mKey=k;const l=$('vl');l.replaceChildren(...live.map(p=>{const b=el('button',p.presence.n+(p.isMe?' (나)':''),'vb'+(M.v===p.peer?' sel':''),()=>{if(!dead)M.v=p.peer});b.style.background=COL[p.presence.c%10];b.disabled=dead;return b}));
   const s=el('button','건너뛰기','vb'+(M.v==='skip'?' sel':''),()=>{if(!dead)M.v='skip'});s.disabled=dead;l.append(s)}}
 $('end').style.display=ph==='end'?'flex':'none';
 if(ph==='end'){const gw=G.w==='g';$('et').textContent=gw?'🪿 거위 승리!':'🦆 오리 승리!';
  const ds=P.filter(p=>G.rl&&G.rl[p.peer]==='d').map(p=>p.presence.n).join(', ');$('er').textContent='오리: '+ds;
  $('again').style.display=isHost?'block':'none'}
 $('role').textContent=ph==='lobby'||!r?'':(dead?'👻 유령 – 작업은 계속할 수 있어요':(r==='d'?'🦆 오리 (처치하고 속이세요)':'🪿 거위 (작업을 끝내세요)'));
 $('bar').firstChild.style.width=(G.tt?Math.min(100,G.td/G.tt*100):0)+'%';$('bar').style.display=ph==='play'?'block':'none';
 $('msg').textContent=ph==='res'?(G.ej?G.ej.n+'님이 추방됐어요 – '+(G.ej.r==='d'?'오리였어요!':'거위였어요…'):'아무도 추방되지 않았어요'):(M.work?'작업 중…':'');
 if(Date.now()>flashT)$('flash').textContent='';
}
setInterval(ui,150);
let last=performance.now();
function frame(t){
 const dt=Math.min(.05,(t-last)/1000);last=t;
 const W=innerWidth,Hh=innerHeight,d=devicePixelRatio||1;if(cv.width!==W*d||cv.height!==Hh*d){cv.width=W*d;cv.height=Hh*d}
 const dead=isDead(),play=G.ph==='play',r=me();
 // move
 if(play&&M.n&&r){
  if(M.work){if(Date.now()>M.work){M.work=0;if(stI>=0)M.done.add(stI)}}
  else{let vx=jv.x+((keys.d||keys.arrowright)?1:0)-((keys.a||keys.arrowleft)?1:0),vy=jv.y+((keys.s||keys.arrowdown)?1:0)-((keys.w||keys.arrowup)?1:0);
   const m=Math.hypot(vx,vy);if(m>1){vx/=m;vy/=m}
   if(vx>.1)M.f=1;else if(vx<-.1)M.f=-1;const nx=M.x+vx*190*dt,ny=M.y+vy*190*dt;
   if(dead||!hit(nx,M.y,13))M.x=nx;if(dead||!hit(M.x,ny,13))M.y=ny}
 }
 // nearby
 const P=players();stI=-1;tgt=null;atBody=false;
 if(play&&r){ST.forEach((s,i)=>{if(!M.done.has(i)&&near(s,[M.x,M.y],60))stI=i});
  if(r==='d'&&!dead){let b=1e9;P.forEach(p=>{if(p.isMe||(G.d||[]).includes(p.peer)||G.rl[p.peer]!=='g')return;const q=Math.hypot(p.presence.x-M.x,p.presence.y-M.y);if(q<90&&q<b){b=q;tgt=p}})}
  atBody=!dead&&((G.b||[]).some(b=>near(b,[M.x,M.y],110))||near([TX,TY],[M.x,M.y],100))}
 const sh=(b,v)=>b.style.display=v?'block':'none';
 sh($('bAct'),play&&stI>=0&&!M.work);sh($('bRep'),play&&atBody);sh($('bKill'),play&&r==='d'&&!dead);
 const cd=Math.ceil((M.cd-Date.now())/1000);$('bKill').textContent=cd>0?cd+'초':'공격';$('bKill').disabled=!tgt||cd>0;
 // draw
 cx.setTransform(d,0,0,d,0,0);cx.fillStyle='#2b2f3a';cx.fillRect(0,0,W,Hh);
 cx.save();cx.translate(W/2-M.x,Hh/2-M.y);
 if(BG.complete)cx.drawImage(BG,0,0,1694,1161);
 cx.fillStyle='#e53935';cx.beginPath();cx.arc(TX,TY,13,0,6.3);cx.fill();cx.fillStyle='#fff';cx.font='12px sans-serif';cx.textAlign='center';cx.fillText('신고',TX,TY-20);
  ST.forEach((s,i)=>{cx.fillStyle=M.done.has(i)?'#777':'#ffc83d';cx.fillRect(s[0]-18,s[1]-18,36,36);cx.fillStyle='#222';cx.fillText(M.done.has(i)?'✓':'작업',s[0],s[1]+4)});
 (G.b||[]).forEach(b=>{cx.fillStyle='#c33';cx.font='26px sans-serif';cx.fillText('💀',b[0],b[1]+8)});
 P.forEach(p=>{const pr=p.presence,pd=(G.d||[]).includes(p.peer);if(pd&&!dead)return;
  let x=M.x,y=M.y;if(!p.isMe){const q=SM[p.peer]||(SM[p.peer]={x:pr.x,y:pr.y});q.x+=(pr.x-q.x)*.3;q.y+=(pr.y-q.y)*.3;x=q.x;y=q.y}
  if(!dead&&!p.isMe&&Math.hypot(x-M.x,y-M.y)>300)return;
  cx.globalAlpha=pd?.45:1;cx.fillStyle=COL[pr.c%10];cx.beginPath();cx.ellipse(x,y+24,18,7,0,0,6.3);cx.fill();
  const f=p.isMe?M.f:(pr.f||-1);cx.save();cx.translate(x,y-4);cx.scale(-f,1);if(SPR.complete&&SPR.naturalWidth)cx.drawImage(SPR,-20,-32,40,SPR.naturalHeight/SPR.naturalWidth*40);cx.restore();
  cx.fillStyle=(r==='d'&&G.rl&&G.rl[p.peer]==='d')?'#ff6b6b':'#fff';cx.font='12px sans-serif';cx.fillText(pr.n,x,y-42);cx.globalAlpha=1});
 cx.restore();
 if(play&&!dead&&r){const g=cx.createRadialGradient(W/2,Hh/2,60,W/2,Hh/2,300);g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(1,'rgba(0,0,0,.93)');cx.fillStyle=g;cx.fillRect(0,0,W,Hh)}
 requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
</script></body></html>
