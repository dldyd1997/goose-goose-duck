<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>구스구스덕</title>
<style>
:root{--bg:#f4f1ea;--fg:#1d1d1f;--card:#fff;--ac:#e8a317;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15171c;--fg:#f2f2f2;--card:#23262e;--ac:#ffc83d}}
:root[data-theme="dark"]{--bg:#15171c;--fg:#f2f2f2;--card:#23262e;--ac:#ffc83d}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
canvas{position:absolute;inset:0;width:100%;height:100%}
.ov{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:color-mix(in srgb,var(--bg) 88%,transparent);padding:16px;text-align:center;overflow:auto}
.card{background:var(--card);border-radius:16px;padding:20px;max-width:340px;width:100%;box-shadow:0 4px 24px #0004;display:flex;flex-direction:column;gap:10px}
button,input{font:inherit;border-radius:12px;border:0;padding:12px 16px}
button{background:var(--ac);color:#222;font-weight:700;cursor:pointer}button:disabled{opacity:.4}
input{background:var(--bg);color:var(--fg);text-align:center}
.chip{display:inline-block;padding:4px 10px;margin:3px;border-radius:99px;color:#111;font-weight:600;font-size:14px}
#flash{position:absolute;top:30%;left:0;right:0;text-align:center;font-size:30px;font-weight:800;color:#fff;text-shadow:0 2px 8px #000;pointer-events:none}
#nameCard{background:#000 url(title.jpg) center/cover no-repeat;justify-content:flex-end}
#nameCard::before{content:"";position:absolute;inset:0;background:linear-gradient(transparent 35%,#000b)}
#nameCard .card{position:relative;background:transparent;box-shadow:none;color:#fff;margin-bottom:6vh}
#ttl{margin:0;font-size:clamp(44px,13vw,84px);font-weight:900;color:#ffc83d;-webkit-text-stroke:3px #1b1b1b;paint-order:stroke fill;text-shadow:0 6px 0 #1b1b1b,0 10px 24px #000a;letter-spacing:2px}
#nameCard input{background:#fffe;color:#222}
#tl{position:absolute;left:10px;top:calc(10px + env(safe-area-inset-top,0px));width:min(38vw,250px);display:flex;flex-direction:column;gap:6px;pointer-events:none}
#bar{height:22px;background:#1a1d24d9;border:2px solid #0008;border-radius:4px;overflow:hidden;display:none}
#bar i{display:block;height:100%;width:0;background:#4cd137;transition:width .4s}
#tasks{background:#23303fd9;border:2px solid #0008;border-radius:4px;color:#fff;pointer-events:auto;display:none}
#th{padding:8px 10px;font-weight:800;display:flex;justify-content:space-between;cursor:pointer}
#tls{margin:0;padding:0 10px 8px;list-style:none;font-size:13px;line-height:1.55}
#tls li.d{color:#7bd88f;text-decoration:line-through}
#badge{position:absolute;left:50%;top:calc(8px + env(safe-area-inset-top,0px));transform:translateX(-50%);display:none;flex-direction:column;align-items:center;gap:2px;pointer-events:none}
#bc{position:static;inset:auto;width:64px;height:64px}
#bl{background:#2b2f3acc;color:#fff;font-size:12px;font-weight:700;padding:2px 14px;border-radius:3px}
#tr{position:absolute;right:10px;top:calc(8px + env(safe-area-inset-top,0px));display:none;gap:8px;align-items:flex-start}
#gear{width:40px;height:40px;padding:0;background:#0000;color:#8a93a3;font-size:30px;line-height:40px}
#mmw{display:flex;flex-direction:column;align-items:center;gap:2px}
#mm{position:relative;width:104px;height:104px;border-radius:50%;overflow:hidden;border:4px solid #e8e8ee;background:#1c2330}
#mmc{position:static;inset:auto;width:100%;height:100%}
#rn{color:#fff;font-size:12px;font-weight:700;text-shadow:0 1px 3px #000}
#msg{position:absolute;top:calc(112px + env(safe-area-inset-top,0px));left:0;right:0;text-align:center;color:#fff;font-weight:800;text-shadow:0 2px 6px #000;pointer-events:none}
#hint{position:absolute;left:50%;bottom:calc(14px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);width:min(50vw,380px);background:#4b3d80f0;color:#fff;border-radius:12px;padding:12px 16px;text-align:center;font-size:14px;line-height:1.4;display:none;pointer-events:none;box-shadow:0 2px 12px #0008}
#joy{position:absolute;left:14px;bottom:calc(20px + env(safe-area-inset-bottom,0px));width:140px;height:140px;border-radius:50%;background:radial-gradient(#8d929c,#5e626c);border:3px solid #d8dbe2;touch-action:none}
#joy b{position:absolute;color:#23262e;font-size:16px;line-height:1}
#joy .u{left:62px;top:8px}#joy .dn{left:62px;bottom:8px}#joy .l{left:10px;top:60px}#joy .r{right:10px;top:60px}
#knob{position:absolute;left:45px;top:45px;width:50px;height:50px;border-radius:50%;background:#15171c;box-shadow:inset 0 0 0 3px #3a3f4a}
.ab{position:absolute;border-radius:50%;display:none;flex-direction:column;align-items:center;justify-content:center;padding:0;border:4px solid #d6d6de;color:#fff;font-weight:800;line-height:1.1;box-shadow:0 3px 10px #0008}
.ab i{font-style:normal;font-size:28px}
#bKill{right:14px;bottom:calc(120px + env(safe-area-inset-bottom,0px));width:104px;height:104px;background:radial-gradient(#9b1c1c,#5e0f0f);border-color:#e53935;font-size:13px}
#bKill i{font-size:38px}
#bRep,#bAct{bottom:calc(22px + env(safe-area-inset-bottom,0px));width:84px;height:84px;background:radial-gradient(#6b4ba8,#3d2670);font-size:12px}
#bRep{right:128px}#bAct{right:22px}
#rep{position:absolute;inset:0;display:none;pointer-events:none;overflow:hidden;z-index:30}
#rep.go{display:block;animation:rfade 2.7s linear forwards}
@keyframes rfade{0%,86%{opacity:1}100%{opacity:0}}
#rep .band{position:absolute;left:0;right:0;top:50%;height:44%;background:linear-gradient(#a30000,#ff2b2b 24%,#fff 50%,#ff2b2b 76%,#a30000);box-shadow:0 0 50px #f00c;transform:translateY(-50%) scaleY(0)}
#rep.go .band{animation:rband .3s cubic-bezier(.2,.9,.3,1.15) forwards}
@keyframes rband{to{transform:translateY(-50%) scaleY(1)}}
#repG{position:absolute;inset:auto;left:2vw;top:50%;height:min(54%,52vw);width:auto;transform:translate(-160%,-50%) rotate(-14deg)}
#rep.go #repG{animation:rgoose .5s .25s cubic-bezier(.2,1.2,.4,1) forwards,rshake .12s .8s 6 alternate}
@keyframes rgoose{to{transform:translate(0,-50%) rotate(-14deg)}}
@keyframes rshake{from{margin-top:-4px}to{margin-top:4px}}
#repB{position:absolute;inset:auto;left:23%;top:50%;width:min(18vw,180px);height:auto;transform:translate(0,-50%) scale(0)}
#rep.go #repB{animation:rbody .35s .55s cubic-bezier(.2,1.4,.4,1) forwards}
@keyframes rbody{to{transform:translate(0,-50%) scale(1)}}
#repTxt{position:absolute;right:5vw;top:50%;font-size:clamp(28px,5.5vw,56px);font-weight:900;color:#fff;-webkit-text-stroke:2px #000;paint-order:stroke fill;text-shadow:0 4px 0 #000a;transform:translate(120%,-50%);white-space:nowrap}
#rep.go #repTxt{animation:rtxt .4s .45s cubic-bezier(.2,1,.3,1) forwards}
@keyframes rtxt{to{transform:translate(0,-50%)}}
@media (max-width:700px){#hint{bottom:calc(172px + env(safe-area-inset-bottom,0px));width:min(80vw,380px)}#tls{font-size:12px}#repB{left:30%;width:20vw}#repTxt{white-space:normal;word-break:keep-all;max-width:46vw;text-align:right;line-height:1.15;font-size:clamp(20px,5.8vw,40px)}}

.card.wide{max-width:min(96vw,760px)}
#mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:8px}
.fc{position:relative;border-radius:12px;padding:6px 2px 4px;background:#0000001f;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;font-weight:700;line-height:1.2}
.fc canvas{position:static;inset:auto;width:56px;height:56px}
.fc.sel{outline:3px solid #ffc83d}.fc.dead{opacity:.35;filter:grayscale(1);pointer-events:none}.fc.ej{outline:3px solid #e53935}
.fc i{font-style:normal}.fc .vd{position:absolute;top:2px;right:6px;font-size:15px;color:#2e7d32}.fc .vt{font-size:11px;color:#777}
#mg{position:relative}
#msvg{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none;overflow:visible}
@keyframes dr{to{stroke-dashoffset:0}}@keyframes fi{to{opacity:1}}
#msvg path{filter:drop-shadow(0 0 2px #000a)}#msvg polygon{opacity:0;animation:fi .2s forwards;filter:drop-shadow(0 0 2px #000a)}
#mskip.sel{outline:3px solid #fff}
#gone{z-index:50;background:#15171cee;color:#fff}
#grace{position:absolute;top:calc(120px + env(safe-area-inset-top,0px));left:0;right:0;text-align:center;color:#fff;font-weight:800;background:#b71c1ccc;padding:6px;display:none;z-index:20}
.chip .kx{margin-left:6px;cursor:pointer}
#bAb{right:132px;bottom:calc(120px + env(safe-area-inset-bottom,0px));width:84px;height:84px;background:radial-gradient(#2d6fa8,#173f66);font-size:12px}
#bomb{position:absolute;top:calc(150px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);background:#c62828e6;color:#fff;font-weight:800;padding:8px 16px;border-radius:10px;display:none;z-index:20;animation:bp .5s infinite alternate;text-align:center}
@keyframes bp{to{transform:translateX(-50%) scale(1.06)}}
.rb{padding:4px 10px;border-radius:99px;font-size:12px;margin:2px;color:#111}.rb:not(.on){opacity:.35}.rb.on:disabled{opacity:1}.rb:disabled{cursor:default}
.fc .tg{font-size:11px;color:#6a1b9a}
.vb{width:100%;text-align:left}.vb.sel{outline:3px solid #fff}
</style></head><body>
<canvas id="cv"></canvas>
<div id="tl"><div id="bar"><i></i></div><div id="tasks"><div id="th"><span id="tt">업무</span><b id="tg">▲</b></div><ul id="tls"></ul></div></div>
<div id="badge"><canvas id="bc" width="128" height="128"></canvas><div id="bl"></div></div>
<div id="tr"><button id="gear">⚙</button><div id="mmw"><div id="mm"><canvas id="mmc" width="208" height="208"></canvas></div><div id="rn"></div></div></div>
<div id="msg"></div>
<div id="hint"></div>
<div id="flash"></div>
<div id="bomb"></div>
<div id="joy"><b class="u">▲</b><b class="dn">▼</b><b class="l">◀</b><b class="r">▶</b><div id="knob"></div></div>
<button class="ab" id="bKill"><i>👊</i><small id="kcd">공격</small></button><button class="ab" id="bAb"><i>🔍</i><small id="abl">조사</small></button><button class="ab" id="bRep"><i>📢</i><small>신고</small></button><button class="ab" id="bAct"><i>🛠️</i><small>작업</small></button>
<div id="rep"><div class="band"></div><canvas id="repG" width="154" height="300"></canvas><canvas id="repB" width="202" height="180"></canvas><div id="repTxt"></div></div>

<div class="ov" id="nameCard" style="display:flex"><div class="card">
<h1 id="ttl">구스구스덕</h1><div style="font-weight:700;text-shadow:0 2px 6px #000">닉네임을 정하고 입장하세요</div>
<input id="nick" maxlength="8" placeholder="닉네임"><a id="tchr" href="#" style="color:#fff;font-size:13px;font-weight:700;text-shadow:0 1px 4px #000">👩‍🏫 교사(방장)로 입장</a><input id="hostpw" type="password" placeholder="방장 비밀번호" style="display:none"><button id="go">입장</button>
<small id="warn"></small></div></div>

<div class="ov" id="lobby"><div class="card"><h3 style="margin:0">대기실</h3><div id="plist"></div>
<div id="cfg" style="font-weight:700">참가 인원 <b id="pc">0</b>명 · 오리(술래) <button id="ndm" class="stp" style="display:none;padding:2px 12px;border-radius:8px">−</button> <b id="ndv">1</b> <button id="ndp" class="stp" style="display:none;padding:2px 12px;border-radius:8px">+</button> 명</div>
<div id="rcfg" style="margin-top:2px"></div>
<div id="wait"></div><button id="start">게임 시작</button>
<small><a href="/qr" target="_blank" style="color:inherit">📱 QR 코드 보기</a></small>
<small>거위는 작업을 모두 끝내고, 오리는 들키지 않게 거위를 탈락시키세요. 시체를 발견하거나 중앙 테이블에서 신고하면 회의가 열려요. 회의 중 대화는 현장에서 직접!</small></div></div>

<div class="ov" id="meet"><div class="card wide"><h3 style="margin:0" id="mt"></h3><div id="mg"><div id="mgrid"></div><svg id="msvg"></svg></div><div id="mres" style="font-weight:800"></div><div id="mact"><button id="mskip">건너뛰기(기권)</button></div><div id="hcon" style="display:none;gap:8px;justify-content:center"><button id="mext">⏱ +30초 연장</button><button id="mend">⏭ 회의 바로 끝내기</button></div></div></div>
<div class="ov" id="gone" style="display:none"><div class="card"><h3 id="gt" style="margin:0"></h3><button onclick="location.reload()">다시 입장하기</button></div></div>
<div id="grace"></div>
<div class="ov" id="end"><div class="card"><h2 id="et" style="margin:0"></h2><div id="er"></div><div id="ec"></div><button id="again">바로 대기실로</button></div></div>

<script>
(async()=>{
function makeRoom(){
 const q=new URLSearchParams(location.search),rm=((q.get('room')||'main').toLowerCase().replace(/[^a-z0-9_-]/g,'').slice(0,24))||'main';
 const st={peers:[],me:'',ok:false,loc:{},ws:null,host:'',pw:'',gc:0,dead:false,onsnap:null};
 const raw=o=>{if(st.ws&&st.ws.readyState===1)st.ws.send(JSON.stringify(o))};
 const sendHost=()=>{if(st.pw)raw({t:'host',pw:st.pw})};
 const send=()=>raw({t:'p',d:st.loc});
 const gone=msg=>{st.dead=true;document.getElementById('gt').textContent=msg;document.getElementById('gone').style.display='flex'};
 const open=()=>{if(st.dead)return;const ws=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host+'/ws?room='+rm);st.ws=ws;
  ws.onopen=()=>{st.ok=true;send();sendHost()};
  ws.onmessage=e=>{let m;try{m=JSON.parse(e.data)}catch(x){return}
   if(m.t==='hello')st.me=m.id;
   else if(m.t==='full')gone('방이 가득 찼어요 (최대 25명)');
   else if(m.t==='kicked')gone('방장이 강퇴했어요.');
   else if(m.t==='closed')gone('방장이 나가서 방이 종료됐어요.');
   else if(m.t==='hostno'){alert('방장 비밀번호가 틀렸어요. 일반 참가자로 참여해요.');st.pw=''}
   else if(m.t==='snap'){st.host=m.h||'';st.gc=m.gc||0;st.peers=m.p.map(p=>({peer:p.id,kind:'viewer',presence:p.d||{},isMe:p.id===st.me,sameTab:p.id===st.me}));if(st.onsnap)st.onsnap()}};
  ws.onclose=()=>{st.ok=false;st.peers=[];if(!st.dead)setTimeout(open,1000)};ws.onerror=()=>{try{ws.close()}catch(x){}}};
 open();
 return{peers:()=>st.peers,ok:()=>st.ok,host:()=>st.host,gc:()=>st.gc,claimHost:pw=>{st.pw=pw;sendHost()},kick:id=>raw({t:'kick',id}),setOnSnap:f=>{st.onsnap=f},presence:patch=>{for(const k in patch){if(patch[k]===null)delete st.loc[k];else st.loc[k]=patch[k]}send();return Promise.resolve()}};
}
const $=i=>document.getElementById(i),cv=$('cv'),cx=cv.getContext('2d');
const COL=['#e53935','#1e88e5','#43a047','#fdd835','#8e24aa','#fb8c00','#00acc1','#f06292','#8d6e63','#cfd8dc'];
const ST=[[832, 414], [700, 540], [1312, 360], [837, 928], [1130, 750], [1294, 834], [1202, 502], [334, 286], [330, 742], [202, 568], [626, 700], [478, 524], [1572, 536], [1128, 954]];
